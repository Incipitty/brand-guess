<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand Guess – Lexique</title>
<meta name="theme-color" content="#1A2380">
<!-- Activ Grotesk : collez ici le lien <link> de votre Adobe Fonts web project pour l'activer -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--royal:#1A2380;--deep:#000D5A;--blue:#28387E;--navy:#1C2652;--pink:#E63784;--light:#9FAEC7;--f:"Activ Grotesk","Archivo","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--royal);color:#fff;font-family:var(--f);line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
header{padding:calc(28px + env(safe-area-inset-top)) 20px 8px;max-width:820px;margin:auto}
h1{font-weight:900;font-size:clamp(34px,9vw,60px);line-height:1;letter-spacing:-.02em}
h1 i{color:var(--pink);font-style:normal}
header p{color:var(--light);margin-top:8px}
.bar{position:sticky;top:0;z-index:5;background:var(--royal);padding:12px 20px 10px;max-width:820px;margin:auto}
.search{width:100%;border:0;border-radius:12px;background:var(--deep);color:#fff;font:600 17px var(--f);padding:14px 16px;outline:2px solid transparent}
.search::placeholder{color:var(--light)}.search:focus{outline-color:var(--pink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:2px solid var(--blue);background:transparent;color:#fff;border-radius:99px;padding:7px 14px;font:700 14px var(--f);cursor:pointer}
.chip[aria-pressed=true]{background:#fff;color:var(--navy);border-color:#fff}
main{max-width:820px;margin:auto;padding:4px 20px 60px}
.lv{margin-top:28px;border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:14px}
.lv small{display:block;font-weight:800;letter-spacing:.14em;font-size:12px}
.lv h2{font-weight:900;font-size:28px;line-height:1.05}
.lv span{font-size:14px}
.card{background:var(--deep);border-radius:14px;margin-top:10px;padding:14px 16px;display:grid;grid-template-columns:5px 1fr;gap:14px}
.card b.bar2{border-radius:3px}
.t{font-weight:900;font-size:17px;letter-spacing:.01em;text-transform:uppercase}
.fr{font-weight:700;font-size:14px;margin-top:1px}
.d{color:#DDE3F2;margin-top:6px;font-size:15.5px}
.none{margin-top:40px;text-align:center;color:var(--light)}
footer{text-align:center;color:var(--light);font-size:13px;padding:0 20px 40px}
footer b{color:#fff;font-weight:900}footer i{color:var(--pink);font-style:normal}
mark{background:var(--pink);color:#fff;border-radius:3px;padding:0 2px}
</style>
</head>
<body>
<header><h1>BRAND GUESS<i> .</i></h1><p>Le lexique du jeu : 120 mots, leur traduction et leur définition.</p></header>
<div class="bar"><input id="q" class="search" type="search" placeholder="Rechercher un mot…" autocomplete="off" aria-label="Rechercher">
<div class="chips" id="chips"></div></div>
<main id="out"></main>
<footer><b>BRAND GUESS</b><i> .</i></footer>
<script>
const LV=[{"n":1,"name":"Couleurs","k":"c","band":"#28387E","tc":"#fff","lc":"#E63784","acc":"#E63784","ic":"#E63784","chipc":"#E63784","items":[["BABY BLUE","Bleu layette","Bleu très clair et doux, évoquant la tendresse, l'innocence et la petite enfance."],["BEIGE","Beige","Teinte neutre sable ou crème, discrète et naturelle, très utilisée en minimalisme."],["BLUSH PINK","Rose poudré","Rose très doux comme les joues qui rougissent, associé au maquillage et au romantisme."],["BURGUNDY","Bordeaux","Rouge foncé aux reflets violets, couleur du vin, évoquant l'élégance et la sophistication."],["CHAMPAGNE","Champagne","Beige doré très pâle, associé à la boisson, à la célébration et au luxe discret."],["DEEP PURPLE","Violet profond","Violet foncé et riche, associé à la magie, au mystère et à la royauté."],["ELECTRIC BLUE","Bleu électrique","Bleu intense et lumineux, presque néon, qui évoque l'électricité, l'énergie et la technologie."],["EMERALD GREEN","Vert émeraude","Vert profond et lumineux, couleur de la pierre précieuse, synonyme de richesse et de prestige."],["FOREST GREEN","Vert forêt","Vert sombre et profond évoquant la forêt, les arbres, les feuilles et l'environnement."],["GOLD","Or","Jaune métallique associé à la médaille, à la victoire, à l'argent et au luxe."],["HOT PINK","Rose vif","Rose très saturé, flashy, associé à Barbie, à l'audace et à l'énergie."],["JET BLACK","Noir de jais","Noir très profond, associé à la nuit, au luxe, à l'élégance et au mystère."],["LAVENDER","Lavande","Violet pâle et apaisant, associé à la fleur, à la Provence et à la détente."],["LILAC","Lilas","Violet clair et délicat, couleur de la fleur du même nom, évoquant le printemps."],["MAUVE","Mauve","Violet pâle tirant sur le rose, doux et un peu nostalgique, comme la fleur de mauve."],["MINT GREEN","Vert menthe","Vert clair et frais rappelant la menthe, la glace et le printemps."],["MUSTARD YELLOW","Jaune moutarde","Jaune foncé tirant sur l'orange, rappelant l'épice et le style vintage ou la mode."],["NAVY BLUE","Bleu marine","Bleu très foncé, sérieux et sobre, associé au monde de l'entreprise, au costume et à l'océan sombre."],["OLIVE GREEN","Vert olive","Vert tirant sur le kaki, associé à l'olive, à la terre et à l'univers militaire."],["PEACH","Pêche","Orange rosé pâle, couleur du fruit et de la peau, douce et chaleureuse."],["PISTACHIO GREEN","Vert pistache","Vert clair et doux tirant sur le jaune, évoquant la noix, la glace et la légèreté."],["PLUM","Prune","Violet foncé tirant sur le rouge, couleur du fruit, entre le raffinement et la gourmandise."],["PURE WHITE","Blanc pur","Blanc sans nuance, symbole de pureté, de propreté, de neige et de mariage."],["ROYAL BLUE","Bleu roi","Bleu vif et profond associé à la confiance, à la loyauté, au pouvoir et à la royauté."],["SALMON PINK","Rose saumon","Rose chaud tirant sur l'orange, comme la chair du poisson."],["SKY BLUE","Bleu ciel","Bleu clair et lumineux associé au ciel, aux nuages, à la paix et à la liberté."],["SUNSHINE YELLOW","Jaune soleil","Jaune vif et lumineux symbolisant le soleil, la joie, l'été et le sourire."],["TEAL","Bleu canard","Bleu-vert sombre, mélange d'équilibre et d'élégance."],["TERRACOTTA","Terre cuite","Orange brun couleur d'argile cuite, associé à la poterie, à la terre et à l'artisanat."],["TURQUOISE","Turquoise","Bleu-vert vif évoquant les eaux tropicales, la fraîcheur et les vacances."]]},{"n":2,"name":"Typographie","k":"t","band":"#1C2652","tc":"#fff","lc":"#9FAEC7","acc":"#9FAEC7","ic":"#9FAEC7","chipc":"#9FAEC7","items":[["ALIGNMENT","Alignement","Façon de positionner le texte : à gauche, à droite, centré ou justifié."],["ASCENDER","Hampe montante","Partie d'une lettre minuscule qui dépasse la hauteur d'x vers le haut (dans le « b », le « d » ou le « h »)."],["BLACKLETTER","Gothique","Écriture aux lettres anguleuses et denses héritée du Moyen Âge, associée à l'Allemagne et à l'ancien."],["BOLD","Gras","Graisse épaisse d'une police : traits plus larges, texte plus fort et plus visible."],["BOWL","Panse","Partie arrondie et fermée d'une lettre (dans le « b », le « d », le « p » ou le « R »)."],["CONDENSED","Condensé","Version étroite d'une police : les lettres sont comprimées en largeur pour gagner de la place."],["COUNTER","Contrepoinçon","Espace vide, fermé ou semi-ouvert, à l'intérieur d'une lettre (dans le « o », le « e » ou le « a »)."],["DESCENDER","Hampe descendante","Partie d'une lettre qui descend sous la ligne de base (dans le « p », le « g » ou le « y »)."],["DISPLAY FONT","Police de titrage","Police conçue pour les grandes tailles (titres, affiches), au caractère marqué mais peu lisible en petit."],["EXTENDED","Étendu","Version élargie d'une police : les lettres sont étirées horizontalement."],["EXTRA BOLD","Extra-gras","Graisse encore plus épaisse que le gras : très forte, lourde et impactante."],["FONT PAIRING","Association de polices","Choix de deux polices (ou plus) qui s'harmonisent et se complètent dans un même design."],["HANDWRITTEN FONT","Police manuscrite","Police qui reproduit une écriture faite à la main (stylo, feutre). Donne un aspect personnel et spontané."],["ITALIC","Italique","Version inclinée d'une police, dessinée spécifiquement et non simplement penchée. Sert à l'emphase ou à la nuance."],["KERNING","Crénage","Réglage de l'espace entre deux lettres précises pour obtenir un rendu visuellement équilibré."],["LEADING","Interlignage","Espace vertical entre deux lignes de texte, mesuré de ligne de base à ligne de base."],["MONOSPACE","Chasse fixe","Police dont tous les caractères ont la même largeur. Typique du code informatique et de la machine à écrire."],["PRIMARY TYPEFACE","Police principale","Police de référence de l'identité de marque, utilisée en priorité pour les titres et les éléments clés."],["READABILITY","Lisibilité","Facilité avec laquelle un texte se lit et se comprend, selon la police, la taille, l'espacement et le contraste."],["REGULAR","Normal / romain","Graisse standard d'une police, ni gras ni maigre. C'est la version de base d'une famille typographique."],["SANS SERIF","Sans empattements","Caractère aux traits terminés net, sans empattements. Aspect moderne, épuré et minimaliste."],["SCRIPT","Script / calligraphique","Police imitant l'écriture calligraphique aux lettres liées. Élégante, souvent utilisée pour les invitations et les mariages."],["SECONDARY TYPEFACE","Police secondaire","Police complémentaire de la principale, utilisée pour les sous-titres ou les textes courants."],["SERIF","Avec empattements","Caractère doté de petits prolongements (empattements) aux extrémités des traits. Évoque le classicisme, la tradition et le luxe."],["SLAB SERIF","Égyptienne","Police à empattements très épais et rectangulaires, d'aspect massif, souvent utilisée pour les titres et affiches."],["STEM","Hampe / fût","Trait vertical principal d'une lettre (la barre du « l » ou du « T »)."],["THIN","Très fin","Graisse extrêmement légère d'une police, aux traits très minces."],["TRACKING","Approche","Réglage de l'espacement uniforme entre toutes les lettres d'un mot ou d'un bloc de texte."],["TYPOGRAPHIC HIERARCHY","Hiérarchie typographique","Organisation du texte par niveaux d'importance (titre, sous-titre, corps) grâce à la taille, la graisse ou la couleur."],["X-HEIGHT","Hauteur d'x","Hauteur des lettres minuscules sans hampes (comme le « x »). Elle influence fortement la lisibilité."]]},{"n":3,"name":"Logo","k":"s","band":"#E63784","tc":"#1C2652","lc":"#fff","acc":"#E63784","ic":"#28387E","chipc":"#E63784","items":[["ABSTRACT MARK","Symbole abstrait","Logo fait de formes géométriques ou abstraites qui ne représentent pas un objet réel mais un concept."],["CLEAR SPACE","Zone de protection","Espace vide minimal à respecter autour du logo, où aucun autre élément ne doit empiéter."],["COMBINATION MARK","Logo mixte","Logo qui associe un texte et un symbole, côte à côte ou superposés."],["CONSTRUCTION GRID","Grille de construction","Grille de cercles, carrés et lignes géométriques sur laquelle le logo est dessiné pour garantir sa cohérence."],["EMBLEM","Emblème","Logo où le texte est intégré dans un badge, un blason ou un cercle. Évoque la tradition."],["GEOMETRIC SHAPES","Formes géométriques","Cercles, carrés, triangles… utilisés pour construire des logos structurés, symétriques et proportionnés."],["GOLDEN RATIO","Nombre d'or","Proportion mathématique d'environ 1,618 (suite de Fibonacci, spirale), utilisée pour créer des compositions harmonieuses."],["LACK OF ORIGINALITY","Manque d'originalité","Erreur : logo trop similaire à d'autres ou copié, sans identité unique."],["LETTERMARK","Monogramme","Logo composé des initiales du nom de la marque (acronyme ou abréviation)."],["MASCOT","Mascotte","Logo constitué d'un personnage (cartoon, animal, personne) qui incarne la marque."],["MINIMUM SIZE","Taille minimale","Plus petite dimension (en pixels ou en mm) à laquelle le logo reste lisible."],["MONOCHROME LOGO","Logo monochrome","Version du logo en une seule couleur (noir ou blanc, par exemple), utilisée quand la couleur est impossible."],["NEGATIVE SPACE","Espace négatif","Utilisation du vide (souvent blanc) pour faire apparaître une forme cachée dans le logo."],["OVERCOMPLICATED DESIGN","Design trop compliqué","Erreur courante : trop de détails et d'éléments, logo difficile à lire et à mémoriser."],["PICTORIAL MARK","Logo pictural","Logo constitué d'une image reconnaissable (un objet, un animal) qui représente la marque."],["POOR FONT CHOICE","Mauvais choix de police","Erreur : police inadaptée au style ou au message de la marque, ou peu lisible."],["POOR READABILITY","Mauvaise lisibilité","Erreur : texte ou détails trop petits ou peu contrastés, difficiles à lire."],["POOR VISUAL BALANCE","Mauvais équilibre visuel","Erreur : éléments mal répartis, qui donnent une impression de déséquilibre ou de désordre."],["PRIMARY LOGO","Logo principal","Version officielle et originale du logo, utilisée en priorité."],["PROPORTIONS","Proportions","Rapport entre largeur et hauteur du logo et de ses éléments, à respecter à tout redimensionnement."],["RESPONSIVE LOGO","Logo adaptatif","Logo décliné en plusieurs versions pour s'adapter à la taille de l'écran (mobile, tablette, ordinateur)."],["REVERSE LOGO","Logo inversé","Version claire (blanche) du logo conçue pour être placée sur un fond sombre."],["SECONDARY LOGO","Logo secondaire","Version alternative du logo (horizontale, simplifiée…) pour les cas où le logo principal ne convient pas."],["SIMPLICITY","Simplicité","Qualité d'un bon logo : minimaliste, clair et facile à retenir."],["SYMBOL","Symbole","Image ou icône qui représente la marque, avec ou sans texte."],["SYMMETRY","Symétrie","Équilibre des deux côtés d'un axe, comme dans un miroir, qui donne une impression d'harmonie."],["TAGLINE","Slogan","Phrase courte associée au logo pour transmettre le message ou la promesse de la marque."],["TOO MANY COLORS","Trop de couleurs","Erreur : palette trop chargée (effet arc-en-ciel), qui nuit à l'harmonie et à la mémorisation."],["VECTOR FORMAT","Format vectoriel","Fichier fondé sur des formes mathématiques (AI, SVG) qui s'agrandit sans perte de qualité. À privilégier pour un logo."],["WORDMARK","Logotype","Logo composé uniquement du nom de la marque, en typographie stylisée."]]},{"n":4,"name":"Technique","k":"h","band":"#9FAEC7","tc":"#1C2652","lc":"#28387E","acc":"#9FAEC7","ic":"#1C2652","chipc":"#9FAEC7","items":[["300 DPI","300 ppp","Résolution standard pour l'impression de qualité : 300 points par pouce."],["ACCESSIBILITY","Accessibilité","Conception qui permet à tous, y compris aux personnes en situation de handicap, de lire et utiliser le contenu (contraste, lisibilité)."],["AI FILE","Fichier AI","Fichier natif d'Adobe Illustrator, au format vectoriel, redimensionnable sans perte."],["ASPECT RATIO","Rapport d'aspect","Proportion entre la largeur et la hauteur d'une image ou d'un écran (16:9, 1:1…)."],["BLEED","Fond perdu","Marge de débordement du visuel au-delà de la coupe, qui évite les liserés blancs après découpe."],["CMYK","CMJN","Cyan, magenta, jaune, noir : mode colorimétrique de l'impression, qui crée les couleurs par superposition d'encres."],["COLOR PROFILE","Profil colorimétrique","Fichier (ICC) décrivant comment interpréter les couleurs d'un appareil, pour une reproduction fidèle écran/impression."],["CROP MARKS","Traits de coupe","Petits traits aux coins d'un document indiquant à l'imprimeur où découper le papier."],["HEX CODE","Code hexadécimal","Code couleur du web, de forme #RRGGBB (par exemple #FFFFFF pour le blanc)."],["JPEG","JPEG","Format d'image compressé avec perte de qualité, adapté aux photos."],["LAYOUT GRID","Grille de mise en page","Structure de colonnes et de lignes qui organise et aligne les éléments d'une page."],["PANTONE","Pantone","Système de référence de couleurs numérotées avec nuancier, qui garantit une couleur identique à l'impression."],["PAPER WEIGHT","Grammage","Poids du papier en g/m², qui indique son épaisseur et sa rigidité."],["PDF","PDF","Format de document portable, standard pour envoyer un fichier prêt à imprimer."],["PIXEL","Pixel","Plus petit élément d'une image numérique : un minuscule carré de couleur."],["PIXELATION","Pixellisation","Effet de flou en gros carrés visibles quand une image est trop agrandie pour sa résolution."],["PNG","PNG","Format d'image sans perte qui gère la transparence. Idéal pour les logos et les fonds transparents."],["PPI","Pixels par pouce","Densité de pixels par pouce sur un écran. Plus elle est élevée, plus l'image est détaillée."],["PRINT PROOF","Épreuve","Test d'impression réalisé avant le tirage final pour vérifier couleurs, textes et découpe."],["PROXIMITY","Proximité","Principe de design : les éléments liés sont rapprochés pour former un groupe visuel."],["PSD FILE","Fichier PSD","Fichier natif de Photoshop qui conserve les calques et permet de continuer l'édition."],["REPETITION","Répétition","Principe de design : reprendre les mêmes éléments, motifs ou styles pour créer de la cohérence."],["RESOLUTION","Résolution","Nombre de pixels ou densité de points d'une image, qui détermine sa netteté."],["RGB","RVB","Rouge, vert, bleu : mode colorimétrique des écrans, qui crée les couleurs par addition de lumière."],["RULE OF THIRDS","Règle des tiers","Composition qui divise l'image en neuf parties (grille 3×3) et place les points d'intérêt sur les lignes ou intersections."],["SAFE AREA","Zone de sécurité","Zone intérieure du document où placer textes et éléments importants pour qu'ils ne soient pas coupés."],["SVG","SVG","Format vectoriel pour le web, léger et redimensionnable à l'infini sans perte de qualité."],["TRIM SIZE","Format fini","Dimensions finales du document après la découpe, en millimètres."],["VISUAL HIERARCHY","Hiérarchie visuelle","Organisation des éléments selon leur importance (taille, contraste, position) pour guider le regard."],["WHITE SPACE","Espace blanc","Zone vide d'une mise en page, qui laisse respirer les éléments et améliore la lisibilité."]]}];
const SH={c:'<circle cx="12" cy="12" r="10"/>',t:'<path d="M3 12 20 3v18z"/>',s:'<rect x="2" y="2" width="20" height="20"/>',h:'<path d="M12 1.5l9 5.2v10.6l-9 5.2-9-5.2V6.7z"/>'};
const ico=(k,col,s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${col}" aria-hidden="true">${SH[k]}</svg>`;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let cur=0;const q=document.getElementById('q'),out=document.getElementById('out'),chips=document.getElementById('chips');
function chip(label,i,k,col){const b=document.createElement('button');b.className='chip';b.innerHTML=(k?ico(k,col,16):'')+label;b.onclick=()=>{cur=i;render()};b.dataset.i=i;chips.appendChild(b)}
chip('Tous',0);LV.forEach((l,i)=>chip('Niveau '+l.n,i+1,l.k,l.chipc));
function hl(t,n){if(!n)return esc(t);const i=norm(t).indexOf(n);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+n.length))+'</mark>'+esc(t.slice(i+n.length))}
function render(){
 const n=norm(q.value.trim());let html='',tot=0;
 [...chips.children].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===cur));
 LV.forEach((l,i)=>{if(cur&&cur!==i+1)return;
  const it=l.items.filter(r=>!n||norm(r[0]+' '+r[1]+' '+r[2]).includes(n));if(!it.length)return;tot+=it.length;
  html+=`<div class="lv" style="background:${l.band};color:${l.tc}">${ico(l.k,l.ic,38)}<div><small style="color:${l.lc}">NIVEAU ${l.n}</small><h2>${l.name}</h2><span>${it.length} carte${it.length>1?'s':''}</span></div></div>`;
  it.forEach(r=>{html+=`<div class="card"><b class="bar2" style="background:${l.acc}"></b><div><div class="t">${hl(r[0],n)}</div><div class="fr" style="color:${l.acc}">${hl(r[1],n)}</div><p class="d">${hl(r[2],n)}</p></div></div>`})});
 out.innerHTML=tot?html:'<p class="none">Aucun mot trouvé.</p>';
}
q.addEventListener('input',render);render();
</script>
</body>
</html>
